<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Mainstreet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0B1220;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #111827;
      border-radius: 18px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.45);
    }
    .logo {
      font-size: 2.4rem;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 1rem;
      color: #C9973A;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #94A3B8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      background: #1E293B;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
      color: #E2E8F0;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #C9973A; }
    .hint {
      font-size: 0.78rem;
      color: #64748B;
      margin-top: -14px;
      margin-bottom: 18px;
    }
    .btn {
      width: 100%;
      background: #C9973A;
      color: #0B1220;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      margin-top: 14px;
      font-size: 0.9rem;
      min-height: 20px;
      color: #94A3B8;
    }
    .msg.error   { color: #f87171; }
    .msg.success { color: #4ade80; }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #C9973A;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    /* Loading spinner */
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(201,151,58,0.2);
      border-top-color: #C9973A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      text-align: center;
      color: #94A3B8;
      font-size: 0.95rem;
    }

    #stateLoading, #stateForm, #stateError, #stateSuccess { display: none; }
    #stateLoading { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Mainstreet</div>

    <!-- Loading: verifying recovery token -->
    <div id="stateLoading">
      <div class="tagline">Password Reset</div>
      <div class="spinner"></div>
      <div class="loading-text">Verifying your link…</div>
    </div>

    <!-- Form: set new password -->
    <div id="stateForm">
      <div class="tagline">Set a new password</div>
      <form onsubmit="submitPassword(event)">
        <label for="pw1">New password</label>
        <input type="password" id="pw1" placeholder="••••••••"
          autocomplete="new-password" minlength="6" required />
        <p class="hint">Minimum 6 characters</p>
        <label for="pw2">Confirm password</label>
        <input type="password" id="pw2" placeholder="••••••••"
          autocomplete="new-password" minlength="6" required />
        <button type="submit" class="btn" id="submitBtn">Set Password &amp; Sign In</button>
      </form>
      <div class="msg" id="formMsg"></div>
    </div>

    <!-- Error: expired or invalid link -->
    <div id="stateError">
      <div class="tagline">Link expired</div>
      <div class="msg error" id="errorMsg">
        This password reset link has expired or is invalid.
      </div>
      <a href="/" class="back-link">← Request a new link</a>
    </div>

    <!-- Success: password updated -->
    <div id="stateSuccess">
      <div class="tagline">Password updated</div>
      <div class="msg success">
        Your password has been set. Redirecting you to sign in…
      </div>
      <a href="/" class="back-link">Sign in now →</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Host-based Supabase routing (prod domain → prod project; previews → pilot). Must precede this init. -->
  <script src="supabase-config.js"></script>
  <script>
    if (!window.__MS_SUPABASE) {
      throw new Error('[reset-password] supabase-config.js must be loaded before this script (window.__MS_SUPABASE missing)');
    }
    const SUPABASE_URL      = window.__MS_SUPABASE.url;
    const SUPABASE_ANON_KEY = window.__MS_SUPABASE.anonKey;

    const { createClient } = window.supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession:     true,
        autoRefreshToken:   true,
        detectSessionInUrl: true,
        storage:            window.localStorage,
      },
    });

    let recoveryReady = false;

    // Capture recovery markers from the URL at load time, BEFORE supabase-js processes and
    // cleans the URL. Recovery links arrive in two formats depending on the project's auth
    // flow: implicit (#...type=recovery → fires PASSWORD_RECOVERY) or PKCE (?code=... → can
    // fire SIGNED_IN instead). Without this flag a PKCE recovery link would be treated as a
    // normal login and redirected into the app, so the user would never see the form.
    const _arrivedViaRecovery =
      /type=recovery/.test(window.location.hash) ||
      /type=recovery/.test(window.location.search) ||
      /[?&]code=/.test(window.location.search);

    function _enterRecoveryForm() {
      if (recoveryReady) return;
      recoveryReady = true;
      clearTimeout(expireTimer);
      show('stateForm');
      document.getElementById('pw1').focus();
    }

    // Register BEFORE the client auto-processes the URL token
    db.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        _enterRecoveryForm();
      } else if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
        // A recovery-link session can surface as SIGNED_IN (PKCE flow). If the URL shows we
        // arrived from a recovery link, treat it as recovery and show the form; otherwise the
        // user is simply already logged in, so send them to the app.
        if (_arrivedViaRecovery) _enterRecoveryForm();
        else window.location.replace('/');
      }
    });

    // If no recovery session materializes within 6 s, the link is expired or malformed
    const expireTimer = setTimeout(() => {
      if (!recoveryReady) show('stateError');
    }, 6000);

    function show(id) {
      ['stateLoading', 'stateForm', 'stateError', 'stateSuccess'].forEach(s => {
        document.getElementById(s).style.display = s === id ? 'block' : 'none';
      });
    }

    async function submitPassword(e) {
      e.preventDefault();
      const pw1   = document.getElementById('pw1').value;
      const pw2   = document.getElementById('pw2').value;
      const btn   = document.getElementById('submitBtn');
      const msgEl = document.getElementById('formMsg');

      if (pw1.length < 6) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Password must be at least 6 characters.';
        return;
      }
      if (pw1 !== pw2) {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Passwords do not match.';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Saving…';
      msgEl.className = 'msg';
      msgEl.textContent = '';

      try {
        const { error } = await db.auth.updateUser({ password: pw1 });
        if (error) throw error;

        // Sign out the recovery session so the user must log in fresh
        await db.auth.signOut();

        show('stateSuccess');
        setTimeout(() => { window.location.replace('/'); }, 2500);
      } catch (err) {
        msgEl.className   = 'msg error';
        msgEl.textContent = err.message || 'Could not update password — please try again.';
        btn.disabled    = false;
        btn.textContent = 'Set Password & Sign In';
      }
    }
  </script>
</body>
</html>
